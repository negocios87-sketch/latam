<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LATAM · Board Academy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/6.6.6/css/flag-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2ede6;--surface:#fff;--navy:#1c2b3a;
  --gold:#b8873f;--goldP:#f5e9d6;--sage:#4a7c6a;--rust:#c0533a;
  --muted:#8a8277;--border:#e0d9d0;--text:#1c2020;
  --radius:8px;--shadow:0 1px 3px rgba(28,32,32,.06),0 4px 16px rgba(28,32,32,.06);
  --latam:#1a6b8a;--latam2:#2596be;--latamBg:#e4f4f8;
  --chile:#c0392b;--chileBg:#fdf0ef;
  --mexico:#1a6b3c;--mexicoBg:#edf7f1;
}
html{font-size:14px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

.topbar{background:var(--navy);padding:0 28px;display:flex;align-items:stretch;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.tb-left{display:flex;align-items:center;gap:18px}
.tb-logo{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:700;color:var(--gold);letter-spacing:.05em}
.tb-badge{background:var(--latam);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 14px;border-radius:20px}
.tb-sep{width:1px;height:30px;background:rgba(255,255,255,.12)}
.tab-nav{display:flex;gap:3px;padding:10px 0}
.tab-btn{background:none;border:none;color:rgba(255,255,255,.45);font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:700;padding:6px 18px;cursor:pointer;border-radius:6px;letter-spacing:.04em;text-transform:uppercase;transition:all .15s}
.tab-btn:hover{color:rgba(255,255,255,.85)}
.tab-btn.active{background:var(--latam);color:#fff}
.tab-btn.active-class{background:#7b3fa0;color:#fff}
.tb-right{display:flex;align-items:center;gap:9px}
.tb-meta{font-size:.68rem;color:rgba(255,255,255,.32);letter-spacing:.03em}
.tbtn{background:none;border:1px solid rgba(255,255,255,.18);border-radius:6px;color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:500;padding:6px 13px;cursor:pointer;transition:all .15s}
.tbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn-snap{background:rgba(245,197,24,.15);border:1px solid rgba(245,197,24,.4);border-radius:6px;color:#f5c518;font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;padding:6px 13px;cursor:pointer}
.tbtn-snap:hover{background:rgba(245,197,24,.28)}
.tbtn-cmp{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35);border-radius:6px;color:#4ade80;font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;padding:6px 13px;cursor:pointer}
.tbtn-cmp:disabled{opacity:.35;cursor:default}
.tbtn-clrcmp{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);border-radius:6px;color:#f87171;font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;padding:6px 13px;cursor:pointer;display:none}
.tbtn-pdf{background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);border-radius:6px;color:#38bdf8;font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;padding:6px 13px;cursor:pointer}
.tbtn-pdf:disabled{opacity:.35;cursor:default}
.class-badge{background:rgba(248,113,113,.18);border:1px solid rgba(248,113,113,.4);border-radius:6px;color:#f87171;font-size:.72rem;font-weight:700;padding:5px 11px;display:none;cursor:pointer}
.class-badge.show{display:inline-block}

.cmp-banner{background:linear-gradient(90deg,#166534,#15803d);color:#fff;padding:8px 24px;font-size:.75rem;font-weight:600;letter-spacing:.04em;display:none;align-items:center;justify-content:space-between}
.cmp-banner.on{display:flex}
.cmp-banner button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:5px;padding:3px 10px;font-size:.72rem;cursor:pointer}

.page{max-width:1200px;margin:0 auto;padding:28px 24px 64px}

.ph-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid var(--border)}
.ph-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;background:var(--latamBg);color:var(--latam)}
.ph-ttl{font-family:'Fraunces',serif;font-size:2rem;font-weight:700;color:var(--navy);line-height:1.1}
.ph-sub{font-size:.8rem;color:var(--muted);margin-top:6px}

.sec-block{margin-top:36px;margin-bottom:16px}
.sec-eyebrow{font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sec-title{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:700;color:var(--navy)}
.sec-date-tag{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-left:10px;vertical-align:middle;position:relative;top:-2px}
.tag-ganho{background:#dcfce7;color:#166534}
.tag-perda{background:#fee2e2;color:#991b1b}
.tag-criado{background:var(--latamBg);color:var(--latam)}
.sec-divider{height:2px;border-radius:2px;margin-top:10px}
.div-latam{background:linear-gradient(90deg,var(--latam),var(--latam2))}
.div-ganho{background:linear-gradient(90deg,#166534,#4ade80)}
.div-perda{background:linear-gradient(90deg,#991b1b,#f87171)}

.kpi-row{display:grid;gap:10px;margin-bottom:18px}
.kpi5{grid-template-columns:repeat(5,1fr)}
.kpi4{grid-template-columns:repeat(4,1fr)}
.kpi3{grid-template-columns:repeat(3,1fr)}
.kpi2{grid-template-columns:repeat(2,1fr)}
.kpi1{grid-template-columns:1fr}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px}
.kpi .lbl{font-size:.62rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.kpi .val{font-family:'Fraunces',serif;font-size:1.75rem;font-weight:700;color:var(--navy);line-height:1}
.kpi .sub{font-size:.69rem;color:var(--muted);margin-top:5px}
.kpi-delta{font-size:.68rem;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:4px}
.delta-up{color:#4ade80}.delta-dn{color:#f87171}.delta-eq{color:var(--muted)}

.charts-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.charts-1{margin-bottom:16px}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 14px;box-shadow:var(--shadow)}
.ccard-ttl{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.cwrap{position:relative;height:170px}
.cwrap.md{height:200px}
.side-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;align-items:start}

.twrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.8rem}
thead{background:var(--navy)}
thead th{color:rgba(255,255,255,.75);font-size:.62rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:10px 14px;text-align:left;white-space:nowrap}
thead th:not(:first-child){text-align:right}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg)}
tbody td{padding:9px 14px;white-space:nowrap}
tbody td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
tfoot td{padding:9px 14px;font-weight:700;color:var(--navy);background:var(--goldP);border-top:1.5px solid var(--border)}
tfoot td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.td-name{font-weight:500;color:var(--navy)}
.ori-row:hover{background:var(--goldP)!important}

.ot-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.ot-title{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.ot-rows{display:flex;flex-direction:column;gap:10px}
.ot-row{display:flex;align-items:center;gap:10px}
.ot-label{width:130px;flex-shrink:0;font-size:.78rem;color:var(--text)}
.ot-track{flex:1;background:var(--border);border-radius:3px;height:7px}
.ot-fill{height:7px;border-radius:3px}
.ot-val{width:28px;text-align:right;font-size:.78rem;font-weight:700;color:var(--navy)}
.ot-pct{width:34px;text-align:right;font-size:.7rem;color:var(--muted)}

.motivos{display:flex;flex-direction:column;gap:9px}
.motivo-row{display:flex;align-items:center;gap:10px}
.motivo-name{width:145px;flex-shrink:0;font-size:.77rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.motivo-track{flex:1;background:var(--border);border-radius:3px;height:5px}
.motivo-fill{height:5px;border-radius:3px}
.motivo-pct{width:34px;text-align:right;font-size:.69rem;color:var(--muted)}
.motivo-count{width:26px;text-align:right;font-size:.77rem;font-weight:600;color:var(--navy)}

.sec-lbl2{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec-lbl2 span{flex:1;height:1px;background:var(--border);display:block}

/* ── Insights ── */
.insight-wrap{margin:10px 0 18px;display:flex;align-items:flex-start;gap:8px}
.insight-text{font-family:'Fraunces',serif;font-size:.9rem;font-weight:300;color:var(--gold);font-style:italic;line-height:1.5;flex:1;min-height:24px;cursor:pointer;padding:6px 10px;border-radius:6px;border:1px dashed transparent;transition:border-color .15s}
.insight-text:empty::before{content:'✦ Clique para adicionar um insight…';color:var(--border);font-size:.8rem;font-style:italic}
.insight-text:hover{border-color:rgba(184,135,63,.3);background:rgba(184,135,63,.04)}
.insight-edit{width:100%;font-family:'Fraunces',serif;font-size:.9rem;font-weight:300;color:var(--gold);font-style:italic;line-height:1.5;padding:6px 10px;border-radius:6px;border:1px solid rgba(184,135,63,.4);background:rgba(184,135,63,.06);outline:none;resize:vertical;min-height:56px;display:none}
.insight-icon{color:rgba(184,135,63,.4);font-size:.75rem;margin-top:8px;cursor:pointer;flex-shrink:0;transition:color .15s}
.insight-icon:hover{color:var(--gold)}

.state-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;gap:14px;color:var(--muted)}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errbanner{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius);color:#991b1b;padding:12px 16px;font-size:.82rem;margin-bottom:20px;display:none}
.pfooter{margin-top:32px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between}
.pfooter span{font-size:.67rem;color:var(--muted)}

.pais-chip{font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:6px;display:inline-block;letter-spacing:.05em;text-transform:uppercase}
.chip-chile{background:var(--chileBg);color:var(--chile);border-left:3px solid var(--chile)}
.chip-mexico{background:var(--mexicoBg);color:var(--mexico);border-left:3px solid var(--mexico)}

/* Classificação */
.cl-select{font-size:.78rem;padding:5px 8px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;cursor:pointer;width:100%}
.cl-input{width:110px;font-size:.78rem;padding:5px 8px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;text-align:right}
.cl-select:focus,.cl-input:focus{outline:none;border-color:var(--latam)}
.row-classified{background:#f0fdf4!important}
.row-classified:hover{background:#dcfce7!important}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9800;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.cmp-modal{background:var(--surface);border-radius:14px;padding:32px 28px;width:420px;max-width:92vw;box-shadow:0 24px 80px rgba(0,0,0,.4)}
.cmp-modal h3{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:6px}
.cmp-modal p{font-size:.78rem;color:var(--muted);margin-bottom:20px}
.drop-area{border:2px dashed var(--border);border-radius:10px;padding:28px;text-align:center;cursor:pointer;margin-bottom:16px}
.drop-area:hover{border-color:var(--latam)}
.drop-area p{color:var(--muted);font-size:.82rem;margin:0}
.drop-area input{display:none}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.mbtn{background:var(--navy);color:#fff;border:none;border-radius:7px;padding:9px 20px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer}
.mbtn-cancel{background:transparent;border:1px solid var(--border);color:var(--muted)}

.hist-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9700;display:none;align-items:flex-start;justify-content:center;padding-top:48px}
.hist-overlay.open{display:flex}
.hist-modal{background:var(--bg);border-radius:14px;width:720px;max-width:95vw;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.hist-header{background:var(--navy);padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
.hist-header h3{font-family:'Fraunces',serif;font-size:1rem;font-weight:700;color:#fff}
.hist-header button{background:none;border:none;color:rgba(255,255,255,.6);font-size:1.2rem;cursor:pointer;padding:4px 8px}
.hist-list{overflow-y:auto;flex:1;padding:16px}
.hist-empty{padding:40px;text-align:center;color:var(--muted);font-size:.85rem}
.hist-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.hist-item-left h4{font-family:'Fraunces',serif;font-size:.95rem;font-weight:600;color:var(--navy)}
.hist-item-left p{font-size:.72rem;color:var(--muted);margin-top:2px}
.hist-item-btns{display:flex;gap:8px}
.hist-btn{background:var(--navy);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:600;cursor:pointer}
.hist-btn-del{background:transparent;border:1px solid var(--border);color:var(--rust)}

@media(max-width:900px){.kpi5,.kpi4,.kpi3{grid-template-columns:1fr 1fr}.charts-2,.side-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-left">
    <span class="tb-logo">Board Academy</span>
    <div class="tb-sep"></div>
    <span class="tb-badge">LATAM</span>
    <div class="tb-sep"></div>
    <div style="display:flex;align-items:center;gap:8px">
      <select id="mesSel" onchange="trocarMes()" style="background:#2d4459;border:1px solid rgba(255,255,255,.25);border-radius:6px;color:#fff;font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:600;padding:5px 10px;cursor:pointer;outline:none">
        <option value="">Carregando…</option>
      </select>
    </div>
    <div class="tab-nav">
      <button class="tab-btn active" id="btn-tab-dash" onclick="switchTab('dash')">📊 Dashboard</button>
      <button class="tab-btn" id="btn-tab-class" onclick="switchTab('class')">🏷 Classificação</button>
    </div>
  </div>
  <div class="tb-right">
    <span class="class-badge" id="classBadge" onclick="switchTab('class')" title="Clique para classificar">⚠ — não classificados</span>
    <span class="tb-meta" id="tbMeta">—</span>
    <button class="tbtn" onclick="openHistorico()">📋 Histórico</button>
    <button class="tbtn-pdf" id="btnPdf" onclick="gerarPDF()" disabled>🖨 PDF</button>
    <button class="tbtn-snap" onclick="doSnapshot()">📸 Snapshot</button>
    <button class="tbtn-cmp" id="btnComparar" onclick="openComparar()" disabled>⇄ Comparar</button>
    <button class="tbtn-clrcmp" id="btnLimparCmp" onclick="limparComparacao()">✕ Comparação</button>
    <button class="tbtn" id="btnRefresh" onclick="doRefresh()">↺ Atualizar</button>
  </div>
</div>

<div class="cmp-banner" id="cmpBanner">
  <span id="cmpBannerTxt">Comparando com: —</span>
  <button onclick="limparComparacao()">✕ Limpar</button>
</div>

<div class="modal-overlay" id="cmpOverlay">
  <div class="cmp-modal">
    <h3>Carregar Snapshot para Comparar</h3>
    <p>Selecione um arquivo <strong>.json</strong> salvo anteriormente</p>
    <div class="drop-area" onclick="document.getElementById('cmpFileInput').click()">
      <p>📂 Clique para selecionar o arquivo JSON</p>
      <input type="file" id="cmpFileInput" accept=".json" onchange="onCmpFile(event)">
    </div>
    <div class="modal-btns">
      <button class="mbtn mbtn-cancel" onclick="closeCmpModal()">Cancelar</button>
    </div>
  </div>
</div>

<div class="hist-overlay" id="histOverlay">
  <div class="hist-modal">
    <div class="hist-header">
      <h3>📋 Histórico de Snapshots</h3>
      <button onclick="closeHistorico()">✕</button>
    </div>
    <div class="hist-list" id="histList"></div>
  </div>
</div>

<div class="page" id="tab-dash">
  <div class="errbanner" id="errBanner"></div>
  <div id="content"><div class="state-wrap"><div class="spinner"></div><span>Carregando dados…</span></div></div>
</div>

<div class="page" id="tab-class" style="display:none">
  <div id="class-content"><div class="state-wrap"><span>Aguardando dados…</span></div></div>
</div>

<script>
let DATA=null,SNAP=null,CURTAB='dash';
const brl  = n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brlK = n=>n>=1000?'R$'+(n/1000).toFixed(0)+'k':'R$'+Math.round(n);
const fmtN = n=>Math.round(n).toLocaleString('pt-BR');
const fmtW = w=>{const[,m,d]=w.split('-');return`${d}/${m}`;};
const fmtD = d=>{const[,,day]=d.split('-');return String(+day);};
const fmtM = ym=>{if(!ym)return'—';const[y,mo]=ym.split('-');return['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][+mo-1]+'/'+y;};
const esc  = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

Chart.register(ChartDataLabels);
Chart.defaults.font={family:'DM Sans',size:10};
Chart.defaults.color='#8a8277';
const GC='rgba(28,32,32,.06)';
const charts={};
function dk(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

const deltaPlugin={id:'delta',afterDatasetsDraw(chart){
  if(!chart.options.plugins?.delta?.show)return;
  const{ctx}=chart,meta=chart.getDatasetMeta(0),data=chart.data.datasets[0].data;
  for(let i=1;i<meta.data.length;i++){
    const prev=data[i-1],curr=data[i];if(!prev||!curr)continue;
    const pct=(curr-prev)/prev*100,isPos=pct>=0;
    const midX=(meta.data[i-1].x+meta.data[i].x)/2,topY=Math.min(meta.data[i-1].y,meta.data[i].y)-18;
    ctx.save();ctx.font='bold 9px DM Sans,sans-serif';ctx.fillStyle=isPos?'#166534':'#991b1b';
    ctx.textAlign='center';ctx.fillText((isPos?'▲':'▼')+Math.abs(pct).toFixed(0)+'%',midX,topY);ctx.restore();
  }
}};
Chart.register(deltaPlugin);

function mkBar(id,labels,values,col,opts={}){
  dk(id);const ctx=document.getElementById(id);if(!ctx)return;
  const isW=opts.weekly||false;
  charts[id]=new Chart(ctx,{type:'bar',
    data:{labels,datasets:[{data:values,backgroundColor:col+'28',borderColor:col,borderWidth:1.5,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:isW?30:22}},
      plugins:{legend:{display:false},
        datalabels:{display:c=>c.dataset.data[c.dataIndex]>0,formatter:v=>fmtN(v),color:col,font:{family:'DM Sans',size:9,weight:'700'},anchor:'end',align:'top',offset:2},

function deltaHtml(atual,anterior){

  if(Math.abs(pct)<0.5)return`<span class="kpi-delta delta-eq">= mesmo</span>`;
  const up=pct>0;
  return`<span class="kpi-delta ${up?'delta-up':'delta-dn'}">${up?'▲':'▼'} ${abs} vs snap</span>`;
}

function getClassMap(){try{return JSON.parse(localStorage.getItem('latam_class')||'{}');}catch{return{};}}

function enrichDeals(deals,classMap){
  return deals.map(d=>{
    const cl=classMap[String(d.id)]||{};
    return{...d,origem:cl.origem||'',valorReal:(cl.ticketCheio&&Number(cl.ticketCheio)>0)?Number(cl.ticketCheio):d.valor};
  });
}

function computeGanhosStats(enriched){
  const total=enriched.length;
  // Receita sempre do Pipe
  const receita=enriched.reduce((s,d)=>s+d.valor,0);
  // Ticket médio usa valorReal (cheio quando informado, senão valor do Pipe)
  const somaTickets=enriched.reduce((s,d)=>s+d.valorReal,0);
  const ticket=total>0?somaTickets/total:0;
  const chile=enriched.filter(d=>d.pais==='CHILE');
  const mexico=enriched.filter(d=>d.pais==='MEXICO');
  const byOrigem={};
  for(const d of enriched){
    const k=d.origem||'Não classificado';
    if(!byOrigem[k])byOrigem[k]={t:0,rev:0,revReal:0,deals:[]};
    byOrigem[k].t++;byOrigem[k].rev+=d.valor;byOrigem[k].revReal+=d.valorReal;byOrigem[k].deals.push(d);
  }
  const ORDER=['Normal','Primeira Parcela','Outras Parcelas','Não classificado'];
  const porOrigem=Object.entries(byOrigem).sort((a,b)=>{
    const ai=ORDER.indexOf(a[0]),bi=ORDER.indexOf(b[0]);
    return(ai<0?99:ai)-(bi<0?99:bi);
  }).map(([nome,x])=>({nome,t:x.t,rev:x.rev,ticketReal:x.t?(x.revReal/x.t):0,deals:x.deals}));
  return{total,receita,ticket,
    chile:{total:chile.length,receita:chile.reduce((s,d)=>s+d.valor,0)},
    mexico:{total:mexico.length,receita:mexico.reduce((s,d)=>s+d.valor,0)},
    porOrigem};
}

function exportarClassificacao(){
  const classMap=getClassMap();
  if(!Object.keys(classMap).length){alert('Nenhuma classificação salva ainda.');return;}
  const now=new Date();
  const payload={exportadoEm:now.toISOString(),mes:DATA?.mes||'',classificacoes:classMap};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download=`classificacao-latam-${now.toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(url);
}

function importarClassificacao(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const json=JSON.parse(ev.target.result);
      if(!json.classificacoes){alert('Arquivo inválido — deve ser um export de classificação.');return;}
      const existing=getClassMap();
      const merged={...existing,...json.classificacoes};
      saveClassMap(merged);
      alert(`✅ ${Object.keys(json.classificacoes).length} classificações importadas e mescladas com as existentes.`);
      renderClassificacao();render();
    }catch(err){alert('Erro ao ler arquivo: '+err.message);}
  };
  reader.readAsText(file);e.target.value='';
}

function salvarClassificacao(){
  const classMap=getClassMap();
  document.querySelectorAll('[data-deal-id]').forEach(row=>{
    const id=row.dataset.dealId;
    const origem=row.querySelector('.cl-select')?.value||'';
    const ticketCheio=parseFloat(row.querySelector('.cl-input')?.value)||0;
    if(origem||ticketCheio>0)classMap[id]={origem,ticketCheio};
    else delete classMap[id];
  });
  saveClassMap(classMap);
  switchTab('dash');
  render();
}

function limparClassificacao(){
  if(!confirm('Limpar todas as classificações?'))return;
  localStorage.removeItem('latam_class');
  renderClassificacao();render();
}

function buildPrintHtml(snap,gStats){
  const d=snap.data,nome=snap.nome||'—';
  const fmtM2=ym=>{if(!ym)return'—';const[y,mo]=ym.split('-');return['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][+mo-1]+'/'+y;};
  const brl2=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
  const fmtN2=n=>Math.round(n).toLocaleString('pt-BR');
  const mes=fmtM2(d.mes);
  const hoje=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  const cr=d.criados,ga=d.ganhos,pe=d.perdidos;
  const kpi=(l,v,s)=>`<div class="kbox"><div class="klbl">${l}</div><div class="kval">${v}</div><div class="ksub">${s}</div></div>`;
  const bar=(lbl,v,total,col)=>{const pct=total>0?Math.round(v/total*100):0;return`<div class="bar-row"><div class="bar-lbl">${lbl}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div><div class="bar-val">${fmtN2(v)}</div><div class="bar-pct">${pct}%</div></div>`;};
  const tbl=(hdrs,rows,foot)=>`<table><thead><tr>${hdrs.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody>${foot?`<tfoot><tr>${foot}</tr></tfoot>`:''}</table>`;

  const crDiaRows=cr.porDia.filter(x=>x.v>0).map(x=>`<tr><td>${x.d.slice(8)+'/'+x.d.slice(5,7)}</td><td>${fmtN2(x.chile)}</td><td>${fmtN2(x.mexico)}</td><td><strong>${fmtN2(x.v)}</strong></td></tr>`).join('');
  const crSemRows=cr.porSemana.filter(x=>x.v>0).map(x=>`<tr><td>${x.w.slice(8)+'/'+x.w.slice(5,7)}</td><td>${fmtN2(x.chile)}</td><td>${fmtN2(x.mexico)}</td><td><strong>${fmtN2(x.v)}</strong></td></tr>`).join('');
  const scChRows=(cr.chile?.scoreFaixas||[]).map(f=>bar(f.label,f.v,cr.chile.total,'#c0392b')).join('');
  const scMxRows=(cr.mexico?.scoreFaixas||[]).map(f=>bar(f.label,f.v,cr.mexico.total,'#1a6b3c')).join('');
  const gaDiaRows=ga.porDia.filter(x=>x.v>0).map(x=>`<tr><td>${x.d.slice(8)+'/'+x.d.slice(5,7)}</td><td>${fmtN2(x.v)}</td><td>${brl2(x.r)}</td></tr>`).join('');
  const gOrigRows=(gStats?.porOrigem||[]).map(o=>`<tr><td>${o.nome}</td><td>${fmtN2(o.t)}</td><td>${brl2(o.rev)}</td><td>${brl2(o.ticket)}</td></tr>`).join('');
  const origTempGRows=(ga.origemTemporal||[]).map(o=>bar(o.label,o.v,gStats?.total||0,'#4a7c6a')).join('');
  const peDiaRows=pe.porDia.filter(x=>x.v>0).map(x=>`<tr><td>${x.d.slice(8)+'/'+x.d.slice(5,7)}</td><td>${fmtN2(x.v)}</td></tr>`).join('');
  const mChRows=(pe.chile?.motivos||[]).map(m=>`<tr><td>${m.m}</td><td>${m.c}</td><td>${m.pct}%</td></tr>`).join('');
  const mMxRows=(pe.mexico?.motivos||[]).map(m=>`<tr><td>${m.m}</td><td>${m.c}</td><td>${m.pct}%</td></tr>`).join('');
  const scPChRows=(pe.chile?.scoreFaixas||[]).map(f=>bar(f.label,f.v,pe.chile.total,'#c0392b')).join('');
  const scPMxRows=(pe.mexico?.scoreFaixas||[]).map(f=>bar(f.label,f.v,pe.mexico.total,'#1a6b3c')).join('');
  const origTempPRows=(pe.origemTemporal||[]).map(o=>bar(o.label,o.v,pe.total,'#c0533a')).join('');

  return`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>LATAM · ${nome}</title>

/* ── Carregar dados ──────────────────────────────────────── */
/* ── Insights ── */
const INSIGHT_KEYS=['criados','ganhos','perdidos'];
function getInsights(){try{return JSON.parse(localStorage.getItem('latam_insights')||'{}');}catch{return{};}}
function saveInsights(m){localStorage.setItem('latam_insights',JSON.stringify(m));}

function insightHtml(key){
  const val=getInsights()[key]||'';
  return`<div class="insight-wrap">
    <span class="insight-icon" onclick="editInsight('${key}')" title="Editar insight">✦</span>
    <div class="insight-text" id="insight-text-${key}" onclick="editInsight('${key}')">${val?escInsight(val):''}</div>
    <textarea class="insight-edit" id="insight-edit-${key}" onblur="saveInsight('${key}')" onkeydown="if(event.key==='Escape')cancelInsight('${key}')">${val}</textarea>
  </div>`;
}

function escInsight(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}

function editInsight(key){
  const txt=document.getElementById('insight-text-'+key);
  const edit=document.getElementById('insight-edit-'+key);
  if(!txt||!edit)return;
  txt.style.display='none';
  edit.style.display='block';
  edit.focus();edit.select();
}

function saveInsight(key){
  const txt=document.getElementById('insight-text-'+key);
  const edit=document.getElementById('insight-edit-'+key);
  if(!txt||!edit)return;
  const val=edit.value.trim();
  const m=getInsights();
  if(val)m[key]=val;else delete m[key];
  saveInsights(m);
  txt.innerHTML=val?escInsight(val):'';
  txt.style.display='block';
  edit.style.display='none';
}

function cancelInsight(key){
  const txt=document.getElementById('insight-text-'+key);
  const edit=document.getElementById('insight-edit-'+key);
  if(!txt||!edit)return;
  edit.value=getInsights()[key]||'';
  txt.style.display='block';edit.style.display='none';
}

function exportarInsights(){
  const data=getInsights();
  if(!Object.keys(data).length){alert('Nenhum insight salvo.');return;}
  const blob=new Blob([JSON.stringify({exportadoEm:new Date().toISOString(),insights:data},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`insights-latam-${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(url);
}

function popularMeses(mesAtual){
  const sel=document.getElementById('mesSel');if(!sel)return;
  // Gera últimos 12 meses a partir de hoje (não depende do backend)
  const hoje=new Date();
  const meses=[];
  for(let i=0;i<12;i++){
    const d=new Date(hoje.getFullYear(),hoje.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][d.getMonth()]+'/'+String(d.getFullYear()).slice(2);
    meses.push({ym,label});
  }
  // Mantém seleção atual se já tiver, senão usa mesAtual do backend
  const current=sel.value&&sel.value!==''&&sel.options.length>1?sel.value:mesAtual;
  sel.innerHTML=meses.map(m=>`<option value="${m.ym}" ${m.ym===current?'selected':''}>${m.label}</option>`).join('');
}

async function trocarMes(){
  const btn=document.getElementById('btnRefresh');
  document.getElementById('content').innerHTML='<div class="state-wrap"><div class="spinner"></div><span>Carregando…</span></div>';
  await loadData();
}

async function loadData(){
  const err=document.getElementById('errBanner');err.style.display='none';
  try{
    const mesSel=document.getElementById('mesSel')?.value||'';
    const url='/api/report'+(mesSel?`?mes=${mesSel}`:'');
    const r=await fetch(url);const j=await r.json();
    if(!j.ok)throw new Error(j.error);
    DATA=j;popularMeses(j.mes);render();
    document.getElementById('btnComparar').disabled=false;
    document.getElementById('btnPdf').disabled=false;
  }catch(e){
    err.textContent=`Erro ao carregar: ${e.message}`;err.style.display='block';
    document.getElementById('content').innerHTML='<div class="state-wrap"><span>Não foi possível carregar os dados.</span></div>';
  }
}
async function doRefresh(){
  const btn=document.getElementById('btnRefresh');btn.disabled=true;btn.textContent='↺ Atualizando…';
  document.getElementById('content').innerHTML='<div class="state-wrap"><div class="spinner"></div><span>Atualizando…</span></div>';
  await loadData();btn.disabled=false;btn.textContent='↺ Atualizar';
}
loadData();
</script>

<!-- Ferramentas de apresentação -->
<canvas id="pCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:8000;pointer-events:none;"></canvas>
<svg id="pSvg" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:8001;pointer-events:none;overflow:visible;"></svg>
<div id="pSpot" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:7999;pointer-events:none;display:none;"></div>
<div id="pZoomBox" style="position:fixed;border:2px dashed #f5c518;background:rgba(245,197,24,.08);z-index:8010;pointer-events:none;display:none;"></div>
<div id="pZoomView" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:9000;background:#f2ede6;display:none;overflow:hidden;">
  <div id="pZoomContent" style="position:absolute;transform-origin:top left;"></div>
  <button onclick="exitZoom()" style="position:fixed;top:18px;right:24px;background:#1c2b3a;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;z-index:9999;">✕ Sair do Zoom (Esc)</button>
</div>
<div id="pToolbar" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(28,43,58,.95);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:40px;display:flex;align-items:center;gap:4px;padding:6px 10px;z-index:9500;box-shadow:0 8px 32px rgba(0,0,0,.4);font-family:'DM Sans',sans-serif;">
  <div style="font-size:.58rem;color:rgba(255,255,255,.3);letter-spacing:.08em;text-transform:uppercase;padding:0 8px 0 4px;border-right:1px solid rgba(255,255,255,.1);margin-right:4px;">Apresentação</div>
  <button class="ptool" id="pt-laser" onclick="setTool('laser')" title="L">🔴 Laser</button>
  <button class="ptool" id="pt-arrow" onclick="setTool('arrow')" title="A">↗ Seta</button>
  <button class="ptool" id="pt-pen"   onclick="setTool('pen')"   title="C">✏️ Caneta</button>
  <button class="ptool" id="pt-spot"  onclick="setTool('spot')"  title="S">🔦 Foco</button>
  <button class="ptool" id="pt-zoom"  onclick="setTool('zoom')"  title="Z">🔍 Zoom</button>
  <div style="width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 4px;"></div>
  <button class="ptool" onclick="clearCanvas()" style="color:rgba(255,100,100,.8)">✕ Limpar</button>
</div>
<style>.ptool{background:none;border:none;color:rgba(255,255,255,.65);font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:500;padding:6px 13px;border-radius:24px;cursor:pointer;transition:all .15s;white-space:nowrap}.ptool:hover{background:rgba(255,255,255,.1);color:#fff}.ptool.on{background:rgba(245,197,24,.25);color:#f5c518;border:1px solid rgba(245,197,24,.4)}</style>
<script>
let pTool=null,pDraw=false,pPoints=[],pArrow=null;
const pCvs=document.getElementById('pCanvas'),pCtx=pCvs.getContext('2d'),pSvg=document.getElementById('pSvg'),pSpot=document.getElementById('pSpot');
let laserTrail=[],laserEl=null,laserTrailEls=[];
function resizeCvs(){pCvs.width=window.innerWidth;pCvs.height=window.innerHeight;}
resizeCvs();window.addEventListener('resize',resizeCvs);
function setTool(t){
  pTool=pTool===t?null:t;
  ['laser','arrow','pen','spot','zoom'].forEach(id=>{const b=document.getElementById('pt-'+id);if(b)b.classList.toggle('on',pTool===id);});
  pCvs.style.pointerEvents=['arrow','pen','zoom'].includes(pTool)?'auto':'none';
  document.body.style.cursor=pTool?'crosshair':'';
  if(pTool!=='spot')pSpot.style.display='none';
  if(pTool!=='laser')clearLaser();
  if(pTool!=='zoom')document.getElementById('pZoomBox').style.display='none';
  if(pTool==='spot')pSpot.style.display='block';
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='l'||e.key==='L')setTool('laser');
  if(e.key==='a'||e.key==='A')setTool('arrow');
  if(e.key==='c'||e.key==='C')setTool('pen');
  if(e.key==='s'||e.key==='S')setTool('spot');
  if(e.key==='z'||e.key==='Z')setTool('zoom');
  if(e.key==='Delete'||e.key==='Backspace')clearCanvas();
  if(e.key==='Escape'){exitZoom();setTool(null);}
});
function clearLaser(){if(laserEl){laserEl.remove();laserEl=null;}laserTrailEls.forEach(e=>e.remove());laserTrailEls=[];laserTrail=[];}
document.addEventListener('mousemove',e=>{
  if(pTool==='laser'){
    laserTrail.push({x:e.clientX,y:e.clientY,t:Date.now()});if(laserTrail.length>20)laserTrail.shift();
    laserTrailEls.forEach(el=>el.remove());laserTrailEls=[];
    const now=Date.now();
    laserTrail.forEach(pt=>{const age=(now-pt.t)/400;if(age>1)return;const r=Math.max(1,4*(1-age)),op=Math.max(0,0.5*(1-age));const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);c.setAttribute('r',r);c.setAttribute('fill',`rgba(255,30,30,${op})`);pSvg.appendChild(c);laserTrailEls.push(c);});
    if(!laserEl){laserEl=document.createElementNS('http://www.w3.org/2000/svg','circle');laserEl.setAttribute('r','5');laserEl.setAttribute('fill','rgba(255,30,30,.95)');if(!document.getElementById('laserDefs')){const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');defs.id='laserDefs';defs.innerHTML='<filter id="laserBlur" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';pSvg.prepend(defs);}laserEl.setAttribute('filter','url(#laserBlur)');pSvg.appendChild(laserEl);}
    laserEl.setAttribute('cx',e.clientX);laserEl.setAttribute('cy',e.clientY);
  }
  if(pTool==='spot')pSpot.style.background=`radial-gradient(circle 200px at ${e.clientX}px ${e.clientY}px,transparent 0%,rgba(0,0,0,.75) 100%)`;
});
pCvs.addEventListener('mousedown',e=>{if(!pTool)return;pDraw=true;if(pTool==='arrow')pArrow={x1:e.clientX,y1:e.clientY};if(pTool==='pen')pPoints=[{x:e.clientX,y:e.clientY}];if(pTool==='zoom')zoomStart(e);});
pCvs.addEventListener('mousemove',e=>{if(!pDraw)return;if(pTool==='pen'){pPoints.push({x:e.clientX,y:e.clientY});drawStroke(pPoints);}if(pTool==='zoom')zoomDrag(e);});
pCvs.addEventListener('mouseup',e=>{if(!pDraw)return;pDraw=false;if(pTool==='arrow'&&pArrow){drawArrow(pArrow.x1,pArrow.y1,e.clientX,e.clientY);pArrow=null;}if(pTool==='pen')pPoints=[];if(pTool==='zoom')zoomEnd(e);});
function drawStroke(pts){if(pts.length<2)return;pCtx.strokeStyle='#e03030';pCtx.lineWidth=2.5;pCtx.lineCap='round';pCtx.lineJoin='round';pCtx.beginPath();pCtx.moveTo(pts[pts.length-2].x,pts[pts.length-2].y);pCtx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);pCtx.stroke();}
function drawArrow(x1,y1,x2,y2){const id=`arr${Date.now()}`;const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=`<defs><marker id="${id}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f5c518"/></marker></defs><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f5c518" stroke-width="3" stroke-linecap="round" marker-end="url(#${id})" opacity="1" style="transition:opacity 1s ease"/>`;pSvg.appendChild(g);setTimeout(()=>{const l=g.querySelector('line');if(l)l.style.opacity='0';},2000);setTimeout(()=>g.remove(),3100);}
function clearCanvas(){pCtx.clearRect(0,0,pCvs.width,pCvs.height);[...pSvg.querySelectorAll('g')].forEach(g=>g.remove());}
let zRect={x:0,y:0,w:0,h:0};const zBox=document.getElementById('pZoomBox');
function zoomStart(e){zRect={x:e.clientX,y:e.clientY,w:0,h:0};zBox.style.cssText+=`;left:${e.clientX}px;top:${e.clientY}px;width:0;height:0;display:block;`;}
function zoomDrag(e){const w=e.clientX-zRect.x,h=e.clientY-zRect.y;zRect.w=w;zRect.h=h;zBox.style.left=(w<0?e.clientX:zRect.x)+'px';zBox.style.top=(h<0?e.clientY:zRect.y)+'px';zBox.style.width=Math.abs(w)+'px';zBox.style.height=Math.abs(h)+'px';}
function zoomEnd(e){
  zBox.style.display='none';const rx=Math.min(zRect.x,e.clientX),ry=Math.min(zRect.y,e.clientY);const rw=Math.abs(zRect.w),rh=Math.abs(zRect.h);if(rw<30||rh<30)return;
  const scale=Math.min(window.innerWidth/rw,window.innerHeight/rh);
  const zv=document.getElementById('pZoomView'),zc=document.getElementById('pZoomContent');
  const clone=document.body.cloneNode(true);
  ['pToolbar','pCanvas','pSvg','pSpot','pZoomBox','pZoomView'].forEach(id=>{const el=clone.querySelector('#'+id);if(el)el.remove();});
  zc.innerHTML='';zc.appendChild(clone);zc.style.width=window.innerWidth+'px';zc.style.height=window.innerHeight+'px';
  zc.style.transform=`scale(${scale}) translate(${-rx}px,${-ry}px)`;zv.style.display='block';setTool(null);
}
function exitZoom(){document.getElementById('pZoomView').style.display='none';}
</script>
</body></html>
